<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 586" width="860" height="586" role="img" aria-label="Terminal: purrfessor init asks a few questions, stores the GitHub secrets, turns on Pages and starts the first deploy">
  <title>purrfessor init</title>
  <rect width="860" height="586" rx="12" fill="#0d1117"/>
  <rect width="860" height="38" rx="12" fill="#161b22"/><rect y="26" width="860" height="12" fill="#161b22"/>
  <circle cx="22" cy="19" r="6.5" fill="#ff5f57"/><circle cx="44" cy="19" r="6.5" fill="#febc2e"/><circle cx="66" cy="19" r="6.5" fill="#28c840"/>
  <text x="430" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">purrfessor init — ~/my-today</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'PingFang SC', 'Noto Sans Mono CJK SC', monospace" font-size="14.5" style="white-space:pre">
    <text x="24" y="62" opacity="0"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">purrfessor init</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0118;0.0158;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="84" opacity="0"><tspan fill="#e6edf3">🧙🐱 Purrfessor · 喵教授 — setting up </tspan><tspan fill="#58a6ff">alex/my-today</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0588;0.0628;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="128" opacity="0"><tspan fill="#8b949e">School presets / 学校预设: generic, ucr</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0882;0.0922;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="150" opacity="0"><tspan fill="#e6edf3">Preset / 预设 [ucr]: </tspan><tspan fill="#8b949e">↵</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1294;0.1334;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="172" opacity="0"><tspan fill="#e6edf3">Language / 语言 (zh = 中文, en = English) [zh]: </tspan><tspan fill="#d29922">en</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1765;0.1805;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="194" opacity="0"><tspan fill="#e6edf3">Your name on the page / 页面上显示的名字 [Me]: </tspan><tspan fill="#d29922">Alex</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2235;0.2275;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="216" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">wrote purrfessor.toml (private — git-ignored)</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2471;0.2511;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="238" opacity="0"><tspan fill="#e6edf3">Canvas token (hidden / 不显示): </tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3059;0.3099;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="260" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">Canvas: Alex Kim</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3471;0.3511;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="282" opacity="0"><tspan fill="#e6edf3">Site password / 网站口令 (hidden / 不显示): </tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3941;0.3981;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="304" opacity="0"><tspan fill="#e6edf3">Again / 再输一次: </tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4294;0.4334;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="326" opacity="0"><tspan fill="#e6edf3">Gemini API key (optional / 可选; hidden): </tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4765;0.4805;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="348" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">secret </tspan><tspan fill="#bc8cff">CANVAS_TOKEN</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5059;0.5099;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="370" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">secret </tspan><tspan fill="#bc8cff">SITE_PASSWORD</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5176;0.5216;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="392" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">secret </tspan><tspan fill="#bc8cff">GEMINI_API_KEY</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5294;0.5334;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="414" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">secret </tspan><tspan fill="#bc8cff">PURRFESSOR_CONFIG</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5412;0.5452;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="436" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">variable </tspan><tspan fill="#bc8cff">PURRFESSOR_ENABLED=true</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5588;0.5628;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="458" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">GitHub Pages → GitHub Actions</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5824;0.5864;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="480" opacity="0"><tspan fill="#3fb950">  ✓ </tspan><tspan fill="#e6edf3">deploy started (takes ~3 min) / 已触发部署（约 3 分钟）</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6118;0.6158;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
    <text x="24" y="524" opacity="0"><tspan fill="#e6edf3">Your page / 你的页面: </tspan><tspan fill="#58a6ff">https://alex.github.io/my-today/</tspan><tspan fill="#e6edf3">  🎉</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6588;0.6628;0.9588;0.9788;1" dur="17.0s" repeatCount="indefinite"/></text>
  </g>
  <rect x="24" y="531" width="9" height="18" fill="#e6edf3">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
