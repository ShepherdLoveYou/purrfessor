[project]
name = "purrfessor"
version = "0.2.0"
description = "Purrfessor · 喵教授 — an encrypted, self-updating daily dashboard for Canvas students, with a self-improving AI agent. Runs free on GitHub Actions + Pages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ShepherdLoveYou" }]
requires-python = ">=3.11"
keywords = ["canvas", "canvas-lms", "student", "dashboard", "github-actions", "ai-agent", "pydantic-ai", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Topic :: Education",
]
dependencies = [
  "google-genai>=2.25,<3",
  "pydantic-ai-slim[google]>=2.52,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
purrfessor = "purrfessor.cli:main"

[project.urls]
Homepage = "https://github.com/ShepherdLoveYou/purrfessor"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["purrfessor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
